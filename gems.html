<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>數學練習大冒險・寶石消消樂</title>
<meta name="theme-color" content="#120b1c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="數學練習">
<link rel="stylesheet" href="assets/common.css">
<style>
body{padding-bottom:20px}
.wrap{width:min(96vw,600px);display:flex;flex-direction:column;gap:10px}

/* 上方跑分條 */
.jack{display:flex;gap:6px}
.jp{
  flex:1;background:linear-gradient(180deg,#3a2150,#1b1029);border:1px solid var(--line);
  border-radius:10px;padding:5px 2px;text-align:center;
}
.jp b{display:block;font-size:9px;color:var(--dim);letter-spacing:1px}
.jp span{font-size:12px;color:var(--gold2);font-variant-numeric:tabular-nums}

/* 盤面 */
.stage{position:relative;width:100%}
.board{
  width:100%;aspect-ratio:6/5;padding:8px;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,#3a2a18,#1d1409);
  border:3px solid #7a5a24;box-shadow:0 16px 46px #000a,inset 0 0 40px #0009;
  display:grid;grid-template-columns:repeat(6,1fr);gap:5px;
}
.col{display:grid;grid-template-rows:repeat(5,1fr);gap:5px;position:relative}
.cell{
  position:relative;border-radius:10px;border:1px solid #ffffff10;
  background:linear-gradient(180deg,#54401f,#2c2010);
  background-image:var(--gemimg);background-size:80% 80%;
  background-position:center;background-repeat:no-repeat;
  display:flex;align-items:flex-end;justify-content:flex-end;
}
.cell b{
  font-size:clamp(9px,1.9vw,13px);color:#fff;background:#00000088;border-radius:6px;
  padding:0 4px;margin:3px;font-weight:800;
}
.col.spin{animation:spinCol .16s linear infinite}
@keyframes spinCol{
  from{transform:translateY(0)}
  to{transform:translateY(calc(100% / 5 + 5px))}
}
.col.spin .cell{filter:blur(2px) brightness(1.15)}
.col.land{animation:land .34s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:translateY(-14px)}60%{transform:translateY(5px)}100%{transform:none}}
.cell.win{
  z-index:3;box-shadow:0 0 0 3px var(--gold) inset,0 0 22px #f6c453cc;
  animation:winpulse .18s ease-in-out 3 alternate;
}
@keyframes winpulse{to{transform:scale(1.07)}}
.board.dim .cell:not(.win){opacity:.42;filter:saturate(.5) brightness(.8)}
.board .cell{transition:opacity .25s,filter .25s}
.cell.gone{animation:burst .34s ease-out forwards}
@keyframes burst{
  18%{transform:scale(1.12);filter:brightness(3)}
  100%{transform:scale(.1) rotate(-20deg);opacity:0}
}

.winbar{
  position:absolute;left:50%;top:-2px;transform:translate(-50%,-50%);z-index:6;
  background:linear-gradient(180deg,#4a3418,#241806);border:2px solid #a2761f;border-radius:12px;
  padding:4px 22px;font-size:clamp(16px,4vw,24px);font-weight:900;color:var(--gold2);
  font-variant-numeric:tabular-nums;box-shadow:0 6px 18px #000a;min-width:120px;text-align:center;
}
.winbar.pop{animation:winpop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes winpop{from{transform:translate(-50%,-50%) scale(.6)}}

/* 乘法結算視窗 */
.quiz{
  position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  background:#100a1ce6;border-radius:16px;
}
.quiz.on{display:flex;animation:fade .2s}
.quiz .inner{width:92%;text-align:center}
.quiz .cnt{font-size:13px;color:var(--gold2);margin-bottom:2px}
.quiz .q{font-size:clamp(28px,7vw,46px);font-weight:900;color:#fff;
  text-shadow:0 3px 0 #7a4a00,0 8px 22px #000;letter-spacing:2px;margin-bottom:8px}
.quiz .q em{font-style:normal;color:var(--gold)}
.quiz .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.quiz .opts button{
  height:clamp(44px,10vw,58px);border-radius:12px;border:1px solid var(--line);cursor:pointer;
  background:linear-gradient(180deg,#3a2557,#251739);color:#fff;
  font-size:clamp(17px,4.2vw,24px);font-weight:900;box-shadow:0 4px 0 #17102a;
}
.quiz .opts button:active{transform:translateY(3px);box-shadow:0 1px 0 #17102a}
.quiz .opts button.right{background:linear-gradient(180deg,#86efac,#16a34a);color:#04240f}
.quiz .opts button.wrong{background:linear-gradient(180deg,#fca5a5,#dc2626);color:#3a0505}
.quiz .timer{height:6px;border-radius:99px;background:#2a1a3d;margin-top:8px;overflow:hidden}
.quiz .timer i{display:block;height:100%;background:linear-gradient(90deg,#facc15,#f87171);
  transition:width .1s linear}

.ctrl{display:flex;gap:8px;align-items:center}
.bet{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:4px 6px}
.bet button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:#32204a;color:var(--gold2);font-size:18px;cursor:pointer}
.bet div{min-width:52px;text-align:center;color:var(--gold2);font-weight:800}
#spin{flex:1}
.big-msg{
  position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;
  flex-direction:column;pointer-events:none;background:radial-gradient(closest-side,#000000aa,#0000);
}
.big-msg.on{display:flex;animation:bigin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bigin{from{transform:scale(.5);opacity:0}}
.big-msg b{font-size:clamp(28px,8vw,56px);color:var(--gold);letter-spacing:4px;
  text-shadow:0 4px 0 #7a4a00,0 10px 30px #000}
.big-msg span{font-size:clamp(20px,5vw,34px);color:#fff;font-variant-numeric:tabular-nums}

@media (max-width:520px){
  body{padding-bottom:96px}
  .betbtn,.bet button{min-width:46px;height:46px;font-size:20px}
}
</style>
</head>
<body>
<img class="hero" id="hero" src="assets/princess.webp" alt="" loading="lazy" decoding="async" fetchpriority="low">
<div class="say" id="say"></div>

<h1>寶 石 消 消 樂</h1>
<div class="vers"></div>

<div class="wrap">
  <div class="jack">
    <div class="jp"><b>GRAND</b><span id="jpG">0</span></div>
    <div class="jp"><b>MAJOR</b><span id="jpA">0</span></div>
    <div class="jp"><b>MINOR</b><span id="jpN">0</span></div>
    <div class="jp"><b>MINI</b><span id="jpI">0</span></div>
  </div>

  <div class="stage">
    <div class="winbar" id="winbar">0</div>
    <div class="board" id="board"></div>
    <div class="quiz" id="quiz">
      <div class="inner">
        <div class="cnt" id="quizCnt"></div>
        <div class="q" id="quizQ"></div>
        <div class="opts" id="quizOpts"></div>
        <div class="timer"><i id="quizTimer"></i></div>
      </div>
    </div>
    <div class="big-msg" id="bigMsg"><b id="bigTitle"></b><span id="bigAmt"></span></div>
    <img class="cat" id="cat" src="assets/cat_jump.webp" alt="" loading="lazy" decoding="async">
  </div>

  <div class="stats">
    <div class="st"><b>星星</b><span id="credit">0</span></div>
    <div class="st"><b>本局得分</b><span id="win">0</span></div>
    <div class="st"><b>連消</b><span id="chain">0</span></div>
    <div class="st"><b>算對率</b><span id="rate">—</span></div>
  </div>

  <div id="modebar"></div>

  <div class="ctrl">
    <div class="bet"><button id="minus">−</button><div id="bet">1</div><button id="plus">＋</button></div>
    <button class="btn" id="spin">轉 動</button>
    <button class="btn ghost" id="auto" style="width:64px;height:52px">自動</button>
  </div>

  <p class="note">
  轉出 <b>4 顆以上連在一起</b>的同款寶石就會消除，接著問你一題：<br>
  <b>消掉幾顆 × 每顆幾分 = ?</b>　算對才拿得到那些分數，算錯只拿一半。<br>
  <span id="noteArcade" style="display:none">（<b>娛樂模式</b>不出題，消到就直接全額給分。）<br></span>
  消完的位置由上方掉落遞補，連續消除有倍數 ×1 ×2 ×3 ×5 ×8。
  </p>
</div>

<script src="assets/common.js"></script>
<script>
/* 每種寶石的單價就是乘法的一個因數（2～9），消掉幾顆就是另一個因數 */
/* 只留 5 種，30 格才連得起來；單價刻意用 3~8，題目才練得到中高段的乘法表 */
const SYMS = [
  {k:'gem',   v:3, w:24, img:'assets/sym_gem.webp'},
  {k:'amber', v:5, w:22, img:'assets/sym_amber.webp'},
  {k:'ruby',  v:6, w:20, img:'assets/sym_ruby.webp'},
  {k:'amy',   v:7, w:18, img:'assets/sym_amethyst.webp'},
  {k:'tiger', v:8, w:12, img:'assets/sym_tiger.webp'}
];
const COLS = 6, ROWS = 5, MIN_CLUSTER = 4;
const CHAIN = [1,2,3,5,8];
const BETS = [1,2,5,10];
const QUIZ_TIME = 8;

const totalW = SYMS.reduce((a,s)=>a+s.w,0);
let grid = [], colEls = [], cellEls = [];
let credit = 300, bet = 1, spinning = false, auto = false;
let winTotal = 0, chain = 0, qOk = 0, qBad = 0;
let jp = {G:270945.07, A:35599.01, N:10952.08, I:2202.28};

const pick = () => {
  let r = Math.random()*totalW;
  for(const s of SYMS){ r -= s.w; if(r<=0) return s; }
  return SYMS[0];
};
function build(){
  const b = $('board');
  b.innerHTML = ''; colEls = []; cellEls = [];
  for(let x=0;x<COLS;x++){
    const col = document.createElement('div');
    col.className = 'col';
    const arr = [];
    for(let y=0;y<ROWS;y++){
      const d = document.createElement('div');
      d.className = 'cell';
      d.innerHTML = '<b></b>';
      col.appendChild(d);
      arr.push(d);
    }
    b.appendChild(col);
    colEls.push(col); cellEls.push(arr);
  }
  grid = Array.from({length:ROWS},()=>Array.from({length:COLS},()=>pick()));
  paint();
}
function paint(hits){
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const s = grid[y][x], d = cellEls[x][y];
    d.className = 'cell' + (hits && hits.has(y+','+x) ? ' win' : '');
    d.style.setProperty('--gemimg', 'url(' + s.img + ')');
    d.querySelector('b').textContent = s.v;
  }
}
function clusters(){
  const seen = Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const out = [];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(seen[y][x]) continue;
    const k = grid[y][x].k, st = [[y,x]], g = [];
    seen[y][x] = true;
    while(st.length){
      const c = st.pop(); g.push(c);
      for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
        const ny = c[0]+d[0], nx = c[1]+d[1];
        if(ny<0||nx<0||ny>=ROWS||nx>=COLS||seen[ny][nx]) continue;
        if(grid[ny][nx].k === k){ seen[ny][nx] = true; st.push([ny,nx]); }
      }
    }
    if(g.length >= MIN_CLUSTER) out.push({sym:grid[y][x], cells:g});
  }
  return out;
}
function collapse(cells){
  const dead = new Set(cells.map(p => p[0]+','+p[1]));
  for(let x=0;x<COLS;x++){
    const keep = [];
    for(let y=ROWS-1;y>=0;y--) if(!dead.has(y+','+x)) keep.push(grid[y][x]);
    for(let y=ROWS-1;y>=0;y--) grid[y][x] = keep[ROWS-1-y] || pick();
  }
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ---------- 乘法結算 ---------- */
function askQuiz(count, value){
  /* 娛樂模式：不問算式，消到就直接全額給分（大人只想轉盤看爆分） */
  if(Mode.isArcade()) return Promise.resolve(true);
  return new Promise(resolve => {
    const ans = count * value;
    $('quizCnt').textContent = '消掉 ' + count + ' 顆，每顆 ' + value + ' 分';
    $('quizQ').innerHTML = count + ' <em>×</em> ' + value + ' <em>=</em> ?';
    const cand = new Set([ans]);
    for(const v of [ans+value, ans-value, ans+count, ans-count, ans+1, ans-2, ans*2].sort(()=>Math.random()-.5)){
      if(v > 0) cand.add(v);
      if(cand.size >= 4) break;
    }
    const list = [...cand].slice(0,4).sort(()=>Math.random()-.5);
    const box = $('quizOpts');
    box.innerHTML = '';
    let done = false, left = QUIZ_TIME;
    const finish = (ok, btn) => {
      if(done) return; done = true;
      clearInterval(t);
      [...box.children].forEach(b => {
        b.disabled = true;
        if(+b.textContent === ans) b.classList.add('right');
      });
      if(btn && !ok) btn.classList.add('wrong');
      ok ? qOk++ : qBad++;
      Stats.mark(count + '×' + value, ok);
      ok ? Sfx.ok(2) : Sfx.bad();
      Char.react(ok, ok);
      if(ok) Char.cat(false);
      $('rate').textContent = Math.round(qOk/(qOk+qBad)*100) + '%';
      setTimeout(()=>{ $('quiz').classList.remove('on'); resolve(ok); }, 620);
    };
    for(const v of list){
      const b = document.createElement('button');
      b.textContent = v;
      b.onclick = () => finish(v === ans, b);
      box.appendChild(b);
    }
    $('quiz').classList.add('on');
    $('quizTimer').style.width = '100%';
    const t = setInterval(()=>{
      left -= 0.1;
      $('quizTimer').style.width = Math.max(0, left/QUIZ_TIME*100) + '%';
      if(left <= 0) finish(false, null);
    }, 100);
  });
}

async function spin(){
  if(spinning) return;
  if(credit < bet){ Char.react(false, false, '星星不夠了'); auto = false; $('auto').classList.remove('on'); return; }
  spinning = true; $('spin').disabled = true;
  credit -= bet;
  winTotal = 0; chain = 0;
  $('win').textContent = '0'; $('chain').textContent = '0';
  $('winbar').textContent = '0';
  render();

  // 逐欄轉動、逐欄停下（照原版機台的節奏）
  colEls.forEach(c => c.classList.add('spin'));
  Sfx.tick();
  let guard = 0;
  do{
    grid = Array.from({length:ROWS},()=>Array.from({length:COLS},()=>pick()));
  }while(!clusters().length && ++guard < 60);
  for(let x=0;x<COLS;x++){
    await sleep(150);
    colEls[x].classList.remove('spin');
    colEls[x].classList.add('land');
    setTimeout(()=>colEls[x].classList.remove('land'), 360);
    Sfx.tick();
  }
  paint();
  await sleep(220);

  while(true){
    const cs = clusters();
    if(!cs.length) break;
    const mult = CHAIN[Math.min(chain, CHAIN.length-1)];
    // 一次處理最大的一組，這樣乘法題才清楚
    cs.sort((a,b)=>b.cells.length - a.cells.length);
    for(const c of cs){
      const hits = new Set(c.cells.map(p => p[0]+','+p[1]));
      paint(hits);
      $('board').classList.add('dim');
      await sleep(420);

      const count = c.cells.length;
      const ok = await askQuiz(count, c.sym.v);
      const base = count * c.sym.v * bet;
      const got = Math.round(ok ? base * mult : base * mult * 0.5);
      winTotal += got;

      for(const p of c.cells) cellEls[p[1]][p[0]].classList.add('gone');
      $('board').classList.remove('dim');
      Sfx.next();
      $('winbar').textContent = winTotal;
      $('winbar').classList.remove('pop'); void $('winbar').offsetWidth; $('winbar').classList.add('pop');
      $('win').textContent = winTotal;
      await sleep(320);
      collapse(c.cells);
      paint();
      await sleep(240);
    }
    chain++;
    $('chain').textContent = chain;
  }

  credit += winTotal;
  Best.set('v3_best', winTotal);
  jp.G += bet*0.02; jp.A += bet*0.015; jp.N += bet*0.01; jp.I += bet*0.008;
  render();
  if(winTotal >= bet*60){ await bigMsg('大 獎', winTotal); }
  else if(winTotal >= bet*25){ await bigMsg('好 厲 害', winTotal); }
  spinning = false; $('spin').disabled = false;
  if(auto) setTimeout(spin, 500);
}
async function bigMsg(title, amt){
  $('bigTitle').textContent = title;
  $('bigAmt').textContent = '+' + amt;
  $('bigMsg').classList.add('on');
  Sfx.win(); Char.react(true, true); Char.cat(true);
  await sleep(1300);
  $('bigMsg').classList.remove('on');
}
function render(){
  $('credit').textContent = credit;
  $('bet').textContent = bet;
  $('jpG').textContent = jp.G.toFixed(2); $('jpA').textContent = jp.A.toFixed(2);
  $('jpN').textContent = jp.N.toFixed(2); $('jpI').textContent = jp.I.toFixed(2);
}

$('spin').onclick = spin;
$('plus').onclick = () => { bet = BETS[Math.min(BETS.indexOf(bet)+1, BETS.length-1)]; render(); };
$('minus').onclick = () => { bet = BETS[Math.max(BETS.indexOf(bet)-1, 0)]; render(); };
$('auto').onclick = () => { auto = !auto; $('auto').classList.toggle('on', auto); if(auto && !spinning) spin(); };
$('cat').onerror = () => { $('cat').style.display = 'none'; };

function paintMode(){
  document.body.classList.toggle('arcade', Mode.isArcade());
  $('noteArcade').style.display = Mode.isArcade() ? '' : 'none';
}
Mode.readonly($('modebar'));
paintMode();
modeBadge();
versionBar('gems.html');
startCoins();
build();
render();
</script>
<script src="assets/audio.js"></script>
<script src="assets/lock.js"></script>
</body>
</html>
