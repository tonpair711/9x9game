<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>數學練習大冒險</title>
<meta name="theme-color" content="#120b1c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="數學練習">
<link rel="stylesheet" href="assets/common.css">
<style>
/* ---------- 大廳改成底部五個分頁（2026-08-23 Steve：不要一頁滑到底，每一頁都要乾淨） ----------
   ① 開始（選模式＋登入帳號）② 玩什麼（練習就選題型／娛樂就看難度，再從這裡出擊）
   ③ 角色（一個帳號最多四個，建好就留著，隨時換誰出戰）④ 練習小遊戲 ⑤ 數據統計 */
:root{--tabh:64px}
body{gap:12px;padding-bottom:calc(var(--tabh) + 26px + env(safe-area-inset-bottom,0px))}
.wrap{width:min(96vw,620px);display:flex;flex-direction:column;gap:14px}
/* 第一步內容比較少，垂直置中比讓下面空一大片好看（只有第一步這樣，別的步驟內容多，維持頂對齊） */
body.atRoot .wrap{min-height:calc(100dvh - 190px);justify-content:center}

/* 一步一頁：一次只顯示一步，不要全部擠在同一頁 */
.step{display:none;flex-direction:column;gap:14px;animation:pgIn .22s ease-out}
.step.on{display:flex}
@keyframes pgIn{from{opacity:0;transform:translateY(8px)}}

/* 第一步已經是大廳最上層，左上角返回鍵在這裡沒有更上一層可回，變暗表示按了沒反應 */
body.atRoot .pagectrl .pcbtn[data-act="back"]{opacity:.35;pointer-events:none}

/* 上面的進度：現在走到第幾步、還有幾步 */
.stepbar{display:flex;align-items:center;gap:6px;justify-content:center;margin:2px 0 2px}
.stepbar b{
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;background:#251739;border:1px solid var(--line);color:#6b578a;
  transition:background .2s,color .2s,transform .2s;flex:none;
}
.stepbar b.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#3a2400;
  border-color:var(--gold);transform:scale(1.12);box-shadow:0 0 12px #f6c45355}
.stepbar b.done{background:#3a2456;color:var(--gold2);border-color:#8a63c9}
.stepbar i{flex:0 1 34px;height:2px;background:#2e1c47;border-radius:2px}
.stepbar i.done{background:#8a63c9}
/* 2026-08-24 Steve 回報：這個字太小、顏色又暗，飄過的背景金幣一蓋過去就看不清是中文字。
   加個底色小標籤，不管金幣飄到哪都還是看得清楚現在是哪一步。 */
.stepbar span{
  font-size:12px;color:var(--gold2);font-weight:700;letter-spacing:1px;margin-left:4px;
  padding:4px 10px;border-radius:999px;background:#2a1a40;border:1px solid var(--line);
  position:relative;z-index:1;white-space:nowrap;
}

/* 底下的上一步／下一步 */
.navbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:#160d24;border-top:1px solid var(--line);box-shadow:0 -8px 26px #0009;
}
.navbar button{
  min-height:52px;border-radius:16px;cursor:pointer;font-family:inherit;
  font-size:16px;font-weight:900;letter-spacing:2px;border:1px solid var(--line);
  background:#251739;color:var(--gold2);transition:transform .1s;
}
.navbar button:active{transform:translateY(3px)}
.navbar .back{flex:0 0 96px}
.navbar .next{flex:1;border:none;color:#3a2400;
  background:linear-gradient(180deg,#fff0c4,var(--gold));box-shadow:0 4px 0 #a97a12}
.navbar .next:disabled{filter:grayscale(.7) brightness(.7);cursor:default;box-shadow:none}
.navbar .next small{display:block;font-size:11px;font-weight:700;letter-spacing:1px;opacity:.72;margin-top:2px}
/* 縮放鎖那顆鈕本來貼在右下角，會被下面那條蓋住，往上抬 */
.zoomlock{bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom,0px)) !important}
.zoomtip{bottom:calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px)) !important}

/* ---------- 第一步：歡迎畫面 ---------- */
.welcome{text-align:center;padding:4px 0 2px;position:relative}
.welcome .big{
  font-size:clamp(24px,6.6vw,38px);font-weight:900;letter-spacing:5px;color:var(--gold2);
  text-shadow:0 3px 0 #7a4a00,0 8px 26px #000a;position:relative;z-index:2;
}
.welcome .sub{font-size:13px;color:var(--dim);letter-spacing:2px;margin-top:6px;position:relative;z-index:2}

/* 傳送門：角色站在會慢慢轉的金色符文環裡出場，呼應出擊頁戰場的拱門 */
.portal{position:relative;width:min(56vw,210px);height:min(56vw,210px);margin:16px auto 0}
.portal::before{
  content:"";position:absolute;inset:4%;border-radius:50%;
  background:radial-gradient(circle,#f6c4532e 0%,#a855f724 52%,transparent 74%);
}
.portal::after{
  content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed #f6c45359;
  animation:portalspin 24s linear infinite;
}
.portal img{
  position:relative;z-index:2;width:80%;height:auto;display:block;margin:10% auto 0;
  filter:drop-shadow(0 10px 22px #000a);animation:wfloat 3.4s ease-in-out infinite alternate;
}
@keyframes portalspin{to{transform:rotate(360deg)}}
@keyframes wfloat{to{transform:translateY(-8px)}}
.statlink{
  width:100%;height:44px;border-radius:12px;cursor:pointer;
  background:#251739;border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:700;
  font-family:inherit;
}

/* ---------- 標題 ---------- */
.logo{text-align:center;margin-top:4px;position:relative}
.logo h1{font-size:clamp(21px,5.4vw,30px);letter-spacing:6px}
.logo p{font-size:11px;color:var(--dim);letter-spacing:3px;margin-top:3px}
.logo::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(80%,340px);height:110px;border-radius:50%;z-index:-1;
  background:radial-gradient(ellipse,#f6c45322,transparent 70%);
}

/* ---------- 區塊標題與面板 ---------- */
.sec{display:flex;align-items:center;gap:10px;margin:2px 2px -4px}
.sec h2{font-size:14px;color:var(--gold);letter-spacing:2px;font-weight:800;white-space:nowrap}
.sec i{flex:1;height:1px;background:linear-gradient(90deg,#573a7d,transparent)}
.panel{
  padding:16px;border-radius:20px;background:linear-gradient(180deg,#2e1c47,#1a1029);
  border:1px solid var(--line);box-shadow:0 10px 28px #0007;
}
.hint{font-size:12px;color:var(--dim);line-height:1.9;text-align:center}
.hint b{color:var(--gold2)}

/* ---------- 玩家卡 ---------- */
.player{
  display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;cursor:pointer;
  background:linear-gradient(135deg,#41285e,#20132f 70%);border:1px solid var(--line);
  box-shadow:0 14px 36px #0009,inset 0 1px 0 #ffffff1a;position:relative;overflow:hidden;
  transition:border-color .2s;
}
.player:hover{border-color:#8a63c9}
.player::before{
  content:"";position:absolute;right:-30px;top:-40px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,#f6c45326,transparent 68%);pointer-events:none;
}
.face{position:relative;flex:none}
.face img{
  width:76px;height:76px;object-fit:cover;object-position:top center;border-radius:50%;
  border:2px solid var(--gold);background:#241638;box-shadow:0 0 0 4px #f6c4531f,0 8px 18px #0008;
}
.face .lvbadge{
  position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:11px;font-weight:800;
  color:#3a2400;padding:2px 10px;border-radius:99px;white-space:nowrap;
  background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 3px 8px #0008;
}
.pinfo{flex:1;min-width:0}
.pinfo .nm{font-size:19px;font-weight:800;color:var(--gold2);letter-spacing:1px}
.pinfo .cls{font-size:11px;color:var(--dim);margin-top:1px}
.expbar{height:10px;border-radius:99px;background:#1b0f2c;margin:8px 0 5px;overflow:hidden;
  box-shadow:inset 0 1px 3px #0009}
.expbar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,1,.3,1);
  background:linear-gradient(90deg,#6ea8ff,#c084fc 55%,#f6c453);box-shadow:0 0 12px #f6c45366}
.pinfo small{font-size:11px;color:var(--dim)}
.gearrow{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.gearrow span{font-size:11px;padding:3px 9px;border-radius:99px;background:#1f1330;
  border:1px solid var(--line);white-space:nowrap}
.gold{
  flex:none;text-align:center;padding:8px 12px;border-radius:14px;
  background:linear-gradient(180deg,#3a2456,#241638);border:1px solid var(--line);
}
.gold b{display:block;font-size:10px;color:var(--dim);font-weight:500;letter-spacing:1px}
.gold span{font-size:21px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}

/* ---------- ① 開始頁 ---------- */
.modepanel{display:flex;flex-direction:column;gap:12px}
.modepanel .modebar button{min-height:64px}
.modepanel .modebar button b{font-size:17px}
.modepanel .modebar button small{font-size:12px}
.gobtn{
  width:100%;min-height:68px;border:none;border-radius:20px;cursor:pointer;font-family:inherit;
  font-size:21px;font-weight:900;letter-spacing:6px;color:#3a2400;
  background:linear-gradient(180deg,#fff0c4,var(--gold));box-shadow:0 6px 0 #a97a12,0 14px 30px #0009;
  transition:transform .12s;
}
.gobtn:active{transform:translateY(5px);box-shadow:0 1px 0 #a97a12}
.gobtn small{display:block;font-size:11px;font-weight:700;letter-spacing:1px;opacity:.72;margin-top:3px}

/* ---------- ③ 角色頁：四個角色格 ---------- */
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot{
  position:relative;border-radius:18px;padding:12px 10px 11px;text-align:center;cursor:pointer;
  background:linear-gradient(180deg,#2a1a3f,#1e1230);border:1px solid var(--line);
  transition:transform .16s ease,border-color .2s,box-shadow .2s;
}
.slot:hover{transform:translateY(-3px);border-color:#8a63c9}
.slot img{width:100%;height:92px;object-fit:contain;object-position:bottom center;
  filter:drop-shadow(0 6px 10px #0009)}
.slot .ph{font-size:40px;line-height:92px}
.slot .nm{font-size:15px;font-weight:800;color:var(--gold2);letter-spacing:1px;margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .meta{font-size:11px;color:var(--dim);margin-top:2px}
.slot.on{
  background:linear-gradient(180deg,#523775,#2c1b42);border-color:var(--gold);
  box-shadow:0 0 0 2px #f6c45344,0 10px 24px #0009;
}
.slot.on::after{
  content:"出戰中";position:absolute;top:7px;right:7px;font-size:9px;font-weight:800;
  background:var(--gold);color:#3a2400;border-radius:99px;padding:2px 8px;box-shadow:0 2px 6px #0007;
}
.slot.empty{border-style:dashed;background:#1c1129}
.slot.empty .plus{font-size:38px;line-height:92px;color:#6b578a}
.slot.empty .nm{color:#8a76ad}
.slotacts{display:flex;gap:8px}
.slotacts button{
  flex:1;height:46px;border-radius:13px;cursor:pointer;font-family:inherit;font-size:13px;
  font-weight:700;background:#251739;border:1px solid var(--line);color:var(--gold2);
}
.slotacts button.danger{color:#f0a3a3}
.slotacts button:active{transform:translateY(2px)}

/* ---------- 選職業（建立角色與換職業共用同一個彈窗） ---------- */
.heroes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.hcard{
  background:linear-gradient(180deg,#2a1a3f,#1e1230);border:1px solid var(--line);border-radius:16px;
  padding:10px 6px 8px;text-align:center;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .16s ease,border-color .2s,box-shadow .2s;
}
.hcard:hover{transform:translateY(-3px);border-color:#8a63c9}
.hcard img{width:100%;height:78px;object-fit:contain;object-position:bottom center;
  filter:drop-shadow(0 6px 10px #0009)}
.hcard .ph{font-size:36px;line-height:78px}
.hcard b{display:block;font-size:13px;color:var(--gold2);margin-top:4px;letter-spacing:1px}
.hcard small{display:block;font-size:10px;color:var(--dim);line-height:1.5;min-height:15px}
.hcard .buff{font-size:10px;color:var(--ok);margin-top:3px;line-height:1.5}
.hcard .trait{font-size:10px;color:var(--gold2);margin-top:4px;line-height:1.45;
  padding-top:4px;border-top:1px dashed #ffffff1f}
.hcard.on{
  background:linear-gradient(180deg,#523775,#2c1b42);border-color:var(--gold);
  box-shadow:0 0 0 2px #f6c45344,0 10px 24px #0009;
}
/* 敬請期待的四個職業：不要只放一個鎖頭，小孩看到純鎖頭是失望，看到剪影才是期待 */
.hcard.lock{cursor:default;background:linear-gradient(180deg,#1b1230,#140c22)}
.hcard.lock:hover{transform:none;border-color:var(--line)}
.hcard.lock .sil{
  height:78px;display:flex;align-items:flex-end;justify-content:center;font-size:44px;
  filter:brightness(0) saturate(0) opacity(.62) drop-shadow(0 0 10px #f6c45355);
}
.hcard.lock b{color:#6b578a;letter-spacing:4px}
.hcard.lock .hint{font-size:10px;color:#8a75ab;line-height:1.5;margin-top:3px;min-height:30px}
.hcard.lock .soon{font-size:10px;color:var(--gold2);margin-top:5px;
  padding-top:4px;border-top:1px dashed #ffffff1f}
/* 邊框跑一圈流動的金光 */
.hcard.lock::after{
  content:"";position:absolute;inset:-1px;border-radius:16px;pointer-events:none;
  background:linear-gradient(115deg,transparent 38%,#f6c4534d 50%,transparent 62%);
  background-size:280% 100%;animation:silShine 3.6s linear infinite;
}
@keyframes silShine{from{background-position:180% 0}to{background-position:-80% 0}}

/* ---------- 遊戲卡 ---------- */
.games{display:flex;flex-direction:column;gap:10px}
.game{
  --ac:#f6c453;
  display:flex;gap:13px;align-items:center;padding:13px 14px 13px 16px;border-radius:18px;
  background:linear-gradient(120deg,#33204d,#1d1230 78%);border:1px solid var(--line);
  text-decoration:none;color:var(--text);position:relative;overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s;
}
.game::before{
  content:"";position:absolute;left:0;top:12%;bottom:12%;width:4px;border-radius:0 4px 4px 0;
  background:var(--ac);box-shadow:0 0 14px var(--ac);
}
.game::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,#ffffff16 50%,transparent 65%);
  transform:translateX(-140%);
}
.game:hover{transform:translateY(-3px);box-shadow:0 14px 32px #000a;border-color:var(--ac)}
.game:hover::after{animation:sheen .7s ease-out}
@keyframes sheen{to{transform:translateX(140%)}}
.game .ic{
  width:58px;height:58px;flex:none;border-radius:16px;display:flex;align-items:center;
  justify-content:center;font-size:28px;position:relative;
  background:radial-gradient(circle at 34% 28%,#3a2456,#1b1029 76%);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 #ffffff22,0 6px 14px #0008;
  background-size:74% 74%;background-position:center;background-repeat:no-repeat;
}
.game .txt{flex:1;min-width:0}
.game .txt b{display:block;font-size:17px;color:#fff;letter-spacing:1px}
.game .txt small{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:12px;color:var(--dim);line-height:1.6;margin-top:3px;
}
.game .rec{
  display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:var(--ac);
  background:#1b1029;border:1px solid var(--line);border-radius:99px;padding:2px 9px;
}
.game .go{
  flex:none;display:flex;align-items:center;gap:4px;white-space:nowrap;
  font-size:14px;font-weight:900;letter-spacing:2px;color:#1b1029;
  background:var(--ac);border-radius:99px;padding:8px 14px;
  box-shadow:0 3px 10px #0007,inset 0 1px 0 #ffffff55;
}
.game .go i{font-style:normal;font-size:15px;line-height:1;opacity:.7}
.game:hover .go{filter:brightness(1.12)}
#gamesMain .game{
  padding:18px 18px 18px 22px;gap:16px;border-radius:22px;
  background:linear-gradient(120deg,#4a2f6d,#2a1840 62%,#1d1230);
  border-color:#f6c45355;box-shadow:0 16px 38px #000a,inset 0 1px 0 #ffffff1a;
}
#gamesMain .game::before{width:6px;top:8%;bottom:8%}
#gamesMain .game .ic{width:76px;height:76px;font-size:38px;border-radius:20px}
#gamesMain .game .ic,#gamesMain .game .txt,#gamesMain .game .go{position:relative;z-index:1}
#gamesMain .game .txt b{font-size:22px}
#gamesMain .game .txt small{-webkit-line-clamp:3;font-size:13px}
#gamesMain .game .go{font-size:16px;padding:11px 20px;letter-spacing:3px}
/* 主線卡右下角壓一隻淡淡的 Boss（這一層原本是掃光，換掉；left:auto 一定要留，
   不然 left:0 會贏過 width，整張圖會貼到左邊壓住文字） */
#gamesMain .game::after{
  content:"";position:absolute;left:auto;right:124px;top:0;bottom:0;width:170px;transform:none;
  background:url(assets/mob_dragon.webp) no-repeat right -18px center/auto 104%;
  opacity:.55;filter:saturate(1) brightness(1.05);
  -webkit-mask-image:linear-gradient(100deg,transparent 18%,#000 62%);
  mask-image:linear-gradient(100deg,transparent 18%,#000 62%);
}
#gamesMain .game:hover::after{animation:none;opacity:.6}
.games.grid .game{align-items:flex-start}
.games.grid .game .ic{margin-top:2px}
.game.new .ic::after{
  content:"新";position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;
  font-size:9px;font-weight:800;padding:2px 7px;border-radius:99px;box-shadow:0 3px 8px #0009;
}

/* ---------- ⑤ 數據統計 ---------- */
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.nums div{background:#211434;border:1px solid var(--line);border-radius:12px;padding:9px 2px;text-align:center}
.nums b{display:block;font-size:10px;color:var(--dim);font-weight:500;letter-spacing:1px}
.nums span{font-size:19px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}
.panel h3{font-size:13px;color:var(--gold);margin-bottom:8px;letter-spacing:1px}
.panel ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.panel li{background:#3a2456;border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:13px}
.panel li i{font-style:normal;color:var(--bad);font-size:11px}
.clearbtn{
  margin-top:14px;width:100%;height:44px;border-radius:12px;cursor:pointer;
  background:#251739;border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:700;
}
.clearbtn:active{transform:translateY(2px)}

/* ---------- 彈窗（建立角色、換職業、取名字） ---------- */
.modalwrap{
  position:fixed;inset:0;z-index:70;background:#07040ce8;
  display:none;align-items:center;justify-content:center;padding:14px;
}
.modalwrap.on{display:flex;animation:mwIn .18s ease-out}
@keyframes mwIn{from{opacity:0}}
.modalbox{
  width:min(94vw,520px);max-height:88vh;overflow:auto;position:relative;
  border-radius:20px;padding:20px 16px 16px;
  background:linear-gradient(180deg,#33204d,#1a1029);border:2px solid var(--line);
  box-shadow:0 22px 60px #000b;animation:mbIn .26s cubic-bezier(.2,1.5,.4,1);
}
@keyframes mbIn{from{transform:translateY(18px) scale(.92);opacity:0}}
.modalbox h2{margin:0 0 4px;font-size:19px;color:var(--gold);letter-spacing:2px;text-align:center}
.modalbox .sub{font-size:12px;color:var(--dim);text-align:center;margin-bottom:14px}
.modalbox .xbtn{
  position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:#20132f;color:var(--dim);font-size:15px;line-height:1;
}
.namerow{margin-top:14px}
.namerow label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:1px}

}

/* ---------- 手機 ---------- */

  .wrap{gap:12px}

  .player{padding:13px;gap:11px}
  .face img{width:64px;height:64px}
  .gold{padding:7px 10px}

  .slot .ph,.slot.empty .plus{line-height:82px}
  .game{padding:11px 12px 11px 14px;gap:11px}

  .game .txt small{font-size:11.5px}
  .games.grid{gap:8px}
  .games.grid .game{padding:10px 11px 10px 13px}
  .games.grid .game .ic{width:46px;height:46px;font-size:22px}

/* ---------- 桌機 ---------- */
@media (min-width:900px){
  .wrap{width:min(96vw,900px)}
  .slots{grid-template-columns:repeat(4,1fr);gap:12px}

  .slot .ph,.slot.empty .plus{line-height:120px}

  .hcard .ph{line-height:104px}

/* 左下那張大立繪在 1080～1400 會壓到內容，超寬螢幕才放出來 */
@media (max-width:1399px){ .hero{display:none} }

    <div class="welcome">

        <img id="wimg" src="assets/fx_hero_ready.webp" alt="">
      </div>

    <div class="sec"><h2>要怎麼玩</h2><i></i></div>
    <div class="modepanel"><div id="modebar"></div></div>

    <div id="topicwrap">
      <div class="sec"><h2>要練哪一種題目</h2><i></i></div>
      <div id="topicbar"></div>
    </div>
    <div id="rangewrap">

  <!-- 第二步：選角色 -->

</div>

<nav class="navbar" id="navbar">

</nav>

<!-- 練習狀況（不放進主流程，要看才打開） -->
<div class="modalwrap" id="statwin">
  <div class="modalbox">
    <button class="xbtn" id="statClose" aria-label="關閉">✕</button>
    <h2>練 習 狀 況</h2>

      <div><b>答對</b><span id="sOk">0</span></div>

<script src="assets/common.js"></script>
<script>Topic.lang = true;   /* 這一頁做得起注音／字母題（2026-08-27） */</script>
<script>
/* 遊戲清單：要加新遊戲只改這一份，卡片與紀錄都會自己長出來 */
const GAMES = [
  {f:'battle.html', n:'勇者出擊', ac:'#f6c453', icon:'⚔️', main:true, img:'assets/fx_hero_ready.webp',
   d:'答對就出手打怪，答錯被反擊。打中敵人害怕的乘法表傷害兩倍，還會掉裝備、升等級。',
   da:'自己按攻擊與閃避打怪，敵人倒數完就撲上來。掉裝備、升等級一樣有，還能挑難度。',
   rec:() => Save.d.totalKill > 0
     ? '打到第 ' + Save.d.round + '-' + (Save.d.wave+1) + ' 關　打倒 ' + Save.d.totalKill + ' 隻'
     : null},
  {f:'https://xuegu.pages.dev/games/xuegu/', n:'學之谷', ac:'#63c169', icon:'🌿', main:true,
   d:'橫向捲軸的動作冒險：打怪、撿寶、升等級，還會學到衝刺與招式。這一關不出題，是純玩的。',
   da:'橫向捲軸的動作冒險：打怪、撿寶、升等級。方向鍵加攻擊鍵就能出招，手機有搖桿與技能鈕。',
   rec:() => null},
  {f:'gems.html', n:'寶石消消樂', ac:'#c084fc', icon:'💎', img:'assets/sym_amethyst.webp',
   d:'轉出 4 顆以上連在一起的寶石就消除，接著問你「消掉幾顆 × 每顆幾分」，算對才拿得到分數。',
   da:'轉出 4 顆以上連在一起的寶石就消除，不出題，消到多少直接拿多少分。',
   rec:() => { const v = Best.get('v3_best'); return v ? '最高一轉得分 ' + v : null; }},
  {f:'findnum.html', n:'找答案挑戰', ac:'#6ea8ff', icon:'🔢',
   d:'出一題「6 × 7」，把盤面上所有 42 點掉，限時 60 秒衝分數。最單純的速度練習。',
   da:'直接給你一個數字，把盤面上所有一樣的點掉，限時 60 秒比眼力。',
   rec:() => { const v = Best.get('v1_score'); return v ? '最高分 ' + v : null; }},
  {f:'racing.html', n:'飆速賽車', ac:'#ff8a5c', icon:'🏎️', isNew:true,
   d:'三線道往前衝，撞上答案正確的牌子就加速加分，撞錯會打滑扣愛心。',
   da:'三線道往前衝，閃過路障開到空的那一道，越開越快。',
   rec:() => { const v = Best.get('v5_score'); return v ? '最高分 ' + v : null; }},
  {f:'memory.html', n:'記憶翻牌', ac:'#f0a3d0', icon:'🃏', isNew:true,
   d:'翻開一張算式牌跟一張答案牌配成一對，全部配完就過關。比誰記得住、翻得少。',
   da:'翻開兩張一樣的圖案配成一對，全部配完就過關，純比記性。',
   rec:() => { const v = Best.get('v6_time'); return v ? '最快 ' + v + ' 秒配完' : null; }},
  {f:'cloudjump.html', n:'雲端跳跳', ac:'#8fd8ff', icon:'☁️', isNew:true,
   d:'跳到答案正確的那朵雲上就往上爬一層，跳錯雲會碎掉掉下去。看能爬到幾樓。',
   da:'跳到有星星的那朵雲，其他一踩就碎；越高雲飄得越快。',
   rec:() => { const v = Best.get('v7_floor'); return v ? '爬到 ' + v + ' 樓' : null; }},
  {f:'bubble.html', n:'深海泡泡', ac:'#5ee6c0', icon:'🐠', isNew:true,
   d:'海裡漂著一堆答案泡泡，限時 60 秒把正確的射破。射錯扣 3 秒，連續射中分數愈高。',
   da:'畫面指定一種顏色，限時 60 秒把那個顏色的泡泡射破。射錯扣 3 秒。',
   rec:() => { const v = Best.get('v8_score'); return v ? '最高分 ' + v : null; }}
];

function gameCard(g){
  const a = document.createElement('a');
  a.className = 'game' + (g.isNew ? ' new' : '');
  a.href = g.f;
  a.style.setProperty('--ac', g.ac);

  const ic = document.createElement('div');
  ic.className = 'ic';
  ic.textContent = g.icon;
  ic.style.background = 'radial-gradient(circle at 34% 28%,' + g.ac + '3d,#1b1029 76%)';
  ic.style.borderColor = g.ac + '66';
  if(g.img){                                   // 有生好的圖就換成圖，沒有就留 emoji
    const im = new Image();
    im.onload = () => {
      ic.textContent = '';
      ic.style.backgroundImage = 'url(' + g.img + ')';
      ic.style.backgroundSize = '74%';
      ic.style.backgroundPosition = 'center';
      ic.style.backgroundRepeat = 'no-repeat';
    };
    im.src = g.img;
  }

  const txt = document.createElement('div');
  txt.className = 'txt';
  const b = document.createElement('b');      b.textContent = g.n;
  const sm = document.createElement('small');
  sm.textContent = (Mode.isArcade() && g.da) ? g.da : g.d;   // 娛樂模式講的是純玩的玩法
  txt.append(b, sm);
  const r = g.rec();
  if(r){
    const rec = document.createElement('div');
    rec.className = 'rec'; rec.textContent = r;
    txt.appendChild(rec);
  }

  /* 右邊那顆從單純的箭頭改成「開始」，小朋友一眼知道點下去就開始玩 */
  const go = document.createElement('div');
  go.className = 'go';
  go.innerHTML = '開 始<i>›</i>';
  a.append(ic, txt, go);
  return a;
}

/* ---------- 一步一頁的流程（2026-08-24 Steve：不要全部擠在一頁） ----------
   ① 歡迎＋選玩法＋帳號 → ② 選角色 → ③ 選主線或小遊戲 → 進戰鬥（battle.html）
   跟原本的底部分頁不一樣：分頁是「隨時亂跳」，流程是「一步一步走」，
   對小學生直觀得多。2026-08-24 Steve：拿掉「快速開始」，就是要每個人都走完三步，
   不要留跳過引導的後門。 */
const STEPS = ['s1','s2','s3'];
const STEP_NAME = ['開始', '角色', '玩什麼'];
let step = 0;

function paintStepBar(){
  $('stepbar').innerHTML = STEPS.map((_, k) =>
    '<b class="' + (k === step ? 'on' : (k < step ? 'done' : '')) + '">' + (k+1) + '</b>' +
    (k < STEPS.length - 1 ? '<i class="' + (k < step ? 'done' : '') + '"></i>' : '')
  ).join('') + '<span>' + STEP_NAME[step] + '</span>';
}
function paintNav(){
  $('navBack').style.visibility = step === 0 ? 'hidden' : '';
  const next = $('navNext');
  if(step < STEPS.length - 1){
    next.innerHTML = '下 一 步<small>' + STEP_NAME[step+1] + '</small>';
    next.disabled = false;
  }else{
    // 最後一步：直接開打（上面那些卡片也點得進去，這顆是給只想打主線的人）
    next.innerHTML = '開 始 冒 險<small>' +
      (Mode.isArcade() ? '娛樂模式・不出題' : '練習模式・' + Topic.name()) + '</small>';
    next.disabled = false;
  }
}
function goStep(k){
  step = Math.max(0, Math.min(STEPS.length - 1, k));
  STEPS.forEach((id, n) => $(id).classList.toggle('on', n === step));
  document.body.classList.toggle('atRoot', step === 0);   // 第一步已經是最上層，左上角返回鍵要跟著變暗
  paintStepBar(); paintNav();
  window.scrollTo({top:0, behavior:'instant'});
}
/* 左上角「返回上一層」在大廳的意思是「上一步」，不是瀏覽器上一頁（見 common.js pagectrl） */
window.appBack = () => { if(step > 0){ goStep(step - 1); Sfx.ok(1); } };
$('navBack').onclick = () => { goStep(step - 1); Sfx.ok(1); };
$('navNext').onclick = () => {
  if(step < STEPS.length - 1){ goStep(step + 1); Sfx.ok(2); }
  else location.href = 'battle.html';
};

/* 練習狀況：不放進主流程（那是給大人看的），要看才打開 */
$('statBtn').onclick = () => { paintStats(); $('statwin').classList.add('on'); };
$('statClose').onclick = () => $('statwin').classList.remove('on');
$('statwin').onclick = e => { if(e.target === $('statwin')) $('statwin').classList.remove('on'); };

/* ---------- 帳號狀態列：沒登入就是一顆登入鈕，登入了顯示名字與登出 ---------- */
function paintUser(){
  const el = $('userbar');
  if(Cloud.logged()){
    el.innerHTML = '<b>👤 ' + Cloud.user() + '</b><span>進度會存到雲端</span>' +
                   '<button id="logoutBtn">登出</button>';
    el.querySelector('#logoutBtn').onclick = async () => {
      await Cloud.logout();
      paintUser();
    };
  }else{
    el.innerHTML = '<b>👤 尚未登入</b><span>目前只存在這台裝置</span>' +
                   '<button id="loginBtn">登入／註冊</button>';
    el.querySelector('#loginBtn').onclick = () => loginBox(async () => {
      paintUser();
      /* 登入後先把雲端這一格拉下來；雲端沒有就把本機的推上去，不會互相蓋掉 */
      try{
        const had = await Cloud.pull(curSlot());
        if(had){ location.reload(); }
        else { await Cloud.push(curSlot()); }
      }catch(e){}
    });
  }
}

/* ---------- 角色格（一個帳號最多四個） ----------
   每一格就是 common.js 的一個存檔位（_s1～_s4），資料各記各的。
   Save.peek(n) 回 null 就代表這一格還沒有人，畫成「＋ 建立角色」。 */
function slotCard(n){
  const d = Save.peek(n), cur = curSlot();
  const card = document.createElement('div');
  card.className = 'slot' + (d ? '' : ' empty') + (n === cur && d ? ' on' : '');
  card.dataset.n = n;

  if(!d){
    const plus = document.createElement('div');
    plus.className = 'plus'; plus.textContent = '＋';
    const nm = document.createElement('div');
    nm.className = 'nm'; nm.textContent = '建立角色';
    const meta = document.createElement('div');
    meta.className = 'meta'; meta.textContent = '第 ' + n + ' 位';
    card.append(plus, nm, meta);
    return card;
  }

  const h = heroOf(d.hero);
  const img = document.createElement('img');
  img.src = h.img; img.alt = '';
  img.onerror = () => {                      // 圖還沒生好就退回 emoji，不要破圖
    const ph = document.createElement('div');
    ph.className = 'ph'; ph.textContent = h.icon;
    img.replaceWith(ph);
  };
  const nm = document.createElement('div');
  nm.className = 'nm'; nm.textContent = (d.pname || '').trim() || h.name;
  const meta = document.createElement('div');
  meta.className = 'meta'; meta.textContent = h.name + '　Lv ' + d.lv;
  card.append(img, nm, meta);
  return card;
}
function paintSlots(){
  const box = $('slots');
  box.innerHTML = '';
  for(let n = 1; n <= SLOT_MAX; n++) box.appendChild(slotCard(n));
  const has = !!Save.peek(curSlot());
  ['renameBtn','reclassBtn','delBtn'].forEach(k => $(k).disabled = !has);
}
/* 換人出戰：存檔位換掉之後整頁重讀最單純——Save／Stats／Best 都是開頁時就讀好的 */
async function switchSlot(n){
  if(n === curSlot()) return;
  setSlot(n);
  if(Cloud.logged()){ try{ await Cloud.pull(n); }catch(e){} }
  location.reload();
}
async function createChar(n, heroKey, name){
  const d = Object.assign({}, DEFAULT_SAVE, {
    gear:emptyGear(), bag:[],
    hero: heroKey, pname: name
  });
  try{ localStorage.setItem(SAVE_KEY + '_s' + n, JSON.stringify(d)); }catch(e){}
  setSlot(n);
  /* 建好角色就直接帶到「玩什麼」——角色這一步已經完成了，不要再退回去 */
  try{ sessionStorage.setItem('mul99_step', '2'); }catch(e){}
  if(Cloud.logged()){ try{ await Cloud.push(n); }catch(e){} }
  location.reload();
}
$('slots').addEventListener('click', e => {
  const c = e.target.closest('.slot'); if(!c) return;
  const n = +c.dataset.n;
  if(c.classList.contains('empty')) openHeroPick('create', n);
  else switchSlot(n);
});

/* ---------- 選職業彈窗：建立角色與換職業共用 ---------- */
let hpMode = 'create', hpSlot = 1, hpHero = HEROES[0].key;
function paintHeroes(){
  const box = $('heroes');
  box.innerHTML = '';
  for(const h of HEROES){
    /* 數值差異列一列，但真正要讓人選的是那條「別人沒有的特色」（h.buff） */
    const buffs = [];
    if(h.atk) buffs.push('攻擊 ' + (h.atk > 0 ? '+' : '') + h.atk);
    if(h.hp)  buffs.push('血量 ' + (h.hp > 0 ? '+' : '') + h.hp);
    if(h.crit) buffs.push('爆擊 +' + h.crit + '%');
    if(h.spell !== 1) buffs.push('魔法 ×' + h.spell);

    const card = document.createElement('div');
    card.className = 'hcard' + (hpHero === h.key ? ' on' : '');
    card.dataset.h = h.key;

    const img = document.createElement('img');
    img.src = h.img; img.alt = '';
    img.onerror = () => {
      const ph = document.createElement('div');
      ph.className = 'ph'; ph.textContent = h.icon;
      img.replaceWith(ph);
    };
    card.appendChild(img);

    const b = document.createElement('b');      b.textContent = h.name;
    const sm = document.createElement('small'); sm.textContent = h.desc;
    const bf = document.createElement('div');   bf.className = 'buff'; bf.textContent = buffs.join('／');
    /* 職業特色（別人沒有的那條）要獨立一行，這才是選職業的理由 */
    const sp = document.createElement('div'); sp.className = 'trait'; sp.textContent = h.buff || '';
    card.append(b, sm, bf, sp);
    box.appendChild(card);
  }
  /* 被收起來的四個：剪影＋一句預告。**故意不寫解鎖條件**——
     寫了卻做不出來，小孩打到那一關發現沒東西會更失望（企劃書 5.2） */
  for(const h of LOCKED_HEROES){
    const card = document.createElement('div');
    card.className = 'hcard lock';
    card.innerHTML =
      '<div class="sil">' + h.icon + '</div>' +
      '<b>？？？</b>' +
      '<div class="hint">' + h.hint + '</div>' +
      '<div class="soon">🔒 ' + h.shape + '之戰士・準備中</div>';
    box.appendChild(card);
  }
}
$('heroes').addEventListener('click', e => {
  const c = e.target.closest('.hcard'); if(!c || c.classList.contains('lock')) return;
  hpHero = c.dataset.h;
  paintHeroes();
  Sfx.ok(3);
});
function openHeroPick(mode, n){
  hpMode = mode; hpSlot = n || curSlot();
  const d = mode === 'create' ? null : Save.d;
  hpHero = d ? d.hero : HEROES[0].key;
  $('hpTitle').textContent = mode === 'create' ? '建 立 角 色' : '換 職 業';
  $('hpSub').textContent = mode === 'create'
    ? '第 ' + hpSlot + ' 位・先挑一個職業，再幫他取名字'
    : '等級、裝備、金幣都會留著，只換職業';
  $('hpNameRow').style.display = mode === 'create' ? '' : 'none';
  $('hpName').value = '';
  paintHeroes();
  $('heropick').classList.add('on');
  if(mode === 'create') setTimeout(() => $('hpName').focus(), 80);
}
const closeHeroPick = () => $('heropick').classList.remove('on');
$('hpClose').onclick = closeHeroPick;
$('heropick').onclick = e => { if(e.target === $('heropick')) closeHeroPick(); };
$('hpOk').onclick = () => {
  if(hpMode === 'create'){
    createChar(hpSlot, hpHero, $('hpName').value.trim().slice(0, 8));
  }else{
    Save.d.hero = hpHero;
    Save.put();
    closeHeroPick();
    paintPlayer(); paintSlots(); paintGames();
    Sfx.ok(3);
  }
};
$('reclassBtn').onclick = () => openHeroPick('change');
$('delBtn').onclick = () => {
  const n = curSlot(), d = Save.peek(n);
  if(!d) return;
  const nm = (d.pname || '').trim() || heroOf(d.hero).name;
  if(!confirm('確定要刪除「' + nm + '」嗎？這個角色的等級、裝備、答題紀錄都會不見。')) return;
  Save.wipe(n);
  /* 刪掉的是正在用的那一格，就換到還有人的那一格；都沒有就留在第 1 格 */
  let go = 1;
  for(let i = 1; i <= SLOT_MAX; i++){ if(Save.peek(i)){ go = i; break; } }
  setSlot(go);
  location.reload();
};

/* ---------- 出戰角色卡 ---------- */
function paintPlayer(){
  const d = Save.d, h = heroOf(d.hero);
  $('plv').textContent = 'Lv ' + d.lv;
  const face = $('pface');
  face.onerror = () => { face.src = 'assets/hero_cheer.webp'; };
  face.src = h.frames ? 'assets/hero_cheer.webp' : h.img;
  $('pname').textContent = playerName();
  $('pcls').textContent = h.name + '・' + h.buff;
  /* 歡迎畫面那張大圖跟著目前出戰的角色走，不要一直是預設那隻 */
  const wi = $('wimg');
  wi.onerror = () => { wi.src = 'assets/fx_hero_ready.webp'; wi.onerror = null; };
  wi.src = h.img;
  $('pgold').textContent = fmtN(d.gold);
  const full = d.lv >= MAX_LV;
  $('pexp').style.width = full ? '100%' : (d.exp / Save.needExp() * 100) + '%';
  $('pexpText').textContent = full
    ? '已經滿等 Lv ' + MAX_LV
    : '經驗 ' + d.exp + ' / ' + Save.needExp();
  const g = d.gear || {}, names = SLOT_NAME;
  $('pgear').innerHTML = GEAR_SLOTS.map(k => {
    const it = g[k];
    return it ? '<span style="color:' + it.color + '">' + it.icon + ' ' + it.name + '</span>'
              : '<span style="color:#6b578a">' + names[k] + '：無</span>';
  }).join('');
}
$('playerCard').onclick = () => openHeroPick('change');

/* 自己取名字：存進 Save.d.pname，八頁都吃這個名字 */
function askName(){
  const box = document.createElement('div');
  box.className = 'pwwrap';
  box.innerHTML =
    '<div class="pwbox">' +
      '<h3>幫你的角色取名字</h3>' +
      '<p>最多 8 個字，留白就用職業本來的名字</p>' +
      '<input id="nmInput" maxlength="8" autocomplete="off" style="letter-spacing:2px;font-size:20px">' +
      '<div class="pwmsg" id="nmMsg"></div>' +
      '<div class="pwbtns"><button class="btn ghost" id="nmCancel">取 消</button>' +
      '<button class="btn" id="nmOk">確 定</button></div>' +
    '</div>';
  document.body.appendChild(box);
  const inp = box.querySelector('#nmInput');
  inp.value = Save.d.pname || '';
  setTimeout(() => { inp.focus(); inp.select(); }, 60);
  const close = () => box.remove();
  const ok = () => {
    Save.d.pname = inp.value.trim().slice(0, 8);
    Save.put();
    close();
    paintPlayer(); paintSlots();
  };
  box.querySelector('#nmOk').onclick = ok;
  box.querySelector('#nmCancel').onclick = close;
  inp.onkeydown = (e) => { if(e.key === 'Enter') ok(); };
  box.onclick = (e) => { if(e.target === box) close(); };
}
$('renameBtn').onclick = askName;

/* ---------- 玩法與題型 ---------- */
function paintPlay(){
  const arc = Mode.isArcade();
  document.body.classList.toggle('arcade', arc);
  $('topicwrap').style.display  = arc ? 'none' : '';   // 娛樂模式不出題，整段題型收起來
  $('rangewrap').style.display  = (arc || !Topic.needsRange()) ? 'none' : '';  // 純九九乘法不用挑範圍
  $('arcadeHint').style.display = arc ? '' : 'none';
  $('voicewrap').style.display  = arc ? 'none' : '';   // 娛樂模式不出題，也就沒有題目要唸
  if(typeof paintNav === 'function') paintNav();
}
Mode.bar($('modebar'), () => { paintPlay(); paintGames(); modeBadge(); });
Topic.bar($('topicbar'), () => { paintPlay(); });
Range.bar($('rangebar'), () => { Topic.bar($('topicbar'), () => { paintPlay(); }); });   // 換範圍要重畫題型按鈕上的數字
Voice.bar($('voicebar'));

function paintGames(){
  const main = $('gamesMain'), sub = $('gamesSub');
  main.innerHTML = ''; sub.innerHTML = '';
  for(const g of GAMES) (g.main ? main : sub).appendChild(gameCard(g));
}

/* ---------- 數據統計 ---------- */
function paintStats(){
  let ok = 0, bad = 0;
  for(const v of Object.values(Stats.data)){ ok += v.ok||0; bad += v.bad||0; }
  $('sOk').textContent = ok;
  $('sBad').textContent = bad;
  $('sRate').textContent = (ok+bad) ? Math.round(ok/(ok+bad)*100) + '%' : '—';
  $('sKill').textContent = Save.d.totalKill;
  $('sWeak').innerHTML = Stats.weakHTML(8);
}
$('clearAll').onclick = () => {
  if(!confirm('確定要清除這個角色的所有紀錄嗎？等級、金幣、裝備、答題紀錄都會不見。')) return;
  Save.reset();
  try{ localStorage.removeItem(STORE_KEY + '_s' + curSlot()); }catch(e){}
  Stats.data = {};
  paintPlayer(); paintSlots(); paintGames(); paintStats();
};

/* ---------- 開場 ---------- */
startCoins();
paintUser();
paintPlay(); modeBadge();
paintPlayer(); paintSlots(); paintGames(); paintStats();

/* 一個角色都還沒建過就直接停在「選角色」那一步（不然按下一步也沒得選）；
   其餘照上次停的地方，離開再回來不用重走 */
let first = 0;
try{ first = +(sessionStorage.getItem('mul99_step') || 0) || 0; }catch(e){}
let anyChar = false;
for(let i = 1; i <= SLOT_MAX; i++){ if(Save.peek(i)){ anyChar = true; break; } }
goStep(anyChar ? first : 1);
/* 每走一步就記起來 */
const _goStep = goStep;
goStep = function(k){ _goStep(k); try{ sessionStorage.setItem('mul99_step', String(step)); }catch(e){} };
</script>

<script src="assets/lock.js"></script>
